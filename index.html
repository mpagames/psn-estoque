<style>
:root{
  --roxo:#6B3FA0; --verde:#2FA84F; --roxo-claro:#8A5FC4; --roxo-escuro:#2E1A47; --creme:#FFF6E5; --lilas:#E4D9F2;
  --texto:#2E1A47; --suave:#6d6280; --borda:#e3d9ee; --branco:#fff;
  --zero-bg:#FDE1E1; --zero:#C62828; --baixo-bg:#FFF1BF; --baixo:#9A6B00; --ok-bg:#DDF3E4; --ok:#1E7B3A;
  --raio:12px; --sombra:0 2px 8px rgba(46,26,71,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--creme);color:var(--texto);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--roxo)}
h1,h2,h3{margin:0 0 .5em;line-height:1.2}
h2{font-size:1.35rem}
h3{font-size:1.05rem}

/* Cabeçalho */
header.topo{background:var(--roxo-escuro);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.topo-linha{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;white-space:nowrap}
.logo{width:36px;height:36px;border-radius:10px;background:var(--roxo);display:grid;place-items:center;font-weight:800;letter-spacing:-.5px;border:2px solid var(--verde)}
.marca small{display:block;font-weight:400;font-size:.75rem;opacity:.75}
.logo-img{height:58px;width:auto;background:var(--creme);border-radius:10px;padding:3px 8px;display:block}
@media(max-width:640px){.logo-img{height:38px}}
.espaco{flex:1}
.btn-desfazer{background:transparent;border:1.5px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:7px 14px;display:flex;gap:6px;align-items:center;max-width:46vw}
.btn-desfazer span.desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem;opacity:.85}
.btn-desfazer:disabled{opacity:.35;cursor:default}
nav.abas{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
nav.abas::-webkit-scrollbar{display:none}
nav.abas button{background:transparent;border:0;color:#e9e1f5;padding:8px 14px;border-radius:999px;white-space:nowrap;font-weight:600}
nav.abas button.ativa{background:var(--roxo);color:#fff}
nav.abas button .badge{background:var(--verde);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;margin-left:4px}

main{max-width:1200px;margin:0 auto;padding:18px 16px 110px}
.cartao{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:16px;margin-bottom:16px}
.aviso{border-radius:var(--raio);padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aviso.amarelo{background:var(--baixo-bg);color:#5b4300}
.aviso.lilas{background:var(--lilas)}
.aviso.verde{background:var(--ok-bg);color:#14532d}
.muted{color:var(--suave)}
.peq{font-size:.85rem}

/* Botões */
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--lilas);color:var(--roxo-escuro)}
.btn:hover{filter:brightness(.97)}
.btn.prim{background:var(--roxo);color:#fff}
.btn.ok{background:var(--verde);color:#fff}
.btn.perigo{background:#fff;color:var(--zero);border:1.5px solid var(--zero)}
.btn.borda{background:#fff;border:1.5px solid var(--borda)}
.btn.mini{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.linha-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Chips / filtros */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--borda);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600}
.chip.ativo{background:var(--roxo);border-color:var(--roxo);color:#fff}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filtros label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--suave);font-weight:600}
input[type=text],input[type=number],input[type=search],select{border:1.5px solid var(--borda);border-radius:10px;padding:9px 11px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid var(--roxo-claro);outline-offset:1px}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--suave);margin:-4px 0 12px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}

/* Painel */
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.numero{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:14px 16px;border-left:6px solid var(--roxo)}
.numero b{display:block;font-size:2rem;line-height:1.1}
.numero.zero{border-color:var(--zero)} .numero.zero b{color:var(--zero)}
.numero.baixo{border-color:#E0A800} .numero.baixo b{color:var(--baixo)}
.numero.ok{border-color:var(--verde)}
.numero.breve{border-color:#cfc6db;color:var(--suave)} .numero.breve b{font-size:1rem;margin-top:6px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.duas{grid-template-columns:1fr}}
.barra-cat{display:flex;align-items:center;gap:10px;margin:8px 0}
.barra-cat .nome{width:140px;font-weight:600}
.barra{flex:1;height:14px;border-radius:7px;background:#eee;display:flex;overflow:hidden}
.barra span{display:block;height:100%}

/* Grade */
.grade-titulo{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px}
.grade-wrap{overflow-x:auto;background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);-webkit-overflow-scrolling:touch}
table.grade{border-collapse:separate;border-spacing:0;width:100%}
table.grade th,table.grade td{padding:5px;text-align:center;border-bottom:1px solid #f1ecf6}
table.grade thead th{position:sticky;top:0;background:#faf7fd;z-index:2;font-size:.8rem;font-weight:600;color:var(--suave);padding:8px 5px;vertical-align:bottom}
table.grade .fixa{position:sticky;left:0;background:#fff;z-index:1;min-width:58px;box-shadow:1px 0 0 #f1ecf6}
table.grade thead .fixa{z-index:3;background:#faf7fd}
table.grade tbody th.fixa{font-size:1.25rem;font-weight:800;color:var(--roxo-escuro)}
table.grade tbody th.fixa.longo{font-size:.95rem;text-align:left;padding-left:12px;min-width:150px}
table.grade td.total,table.grade th.total{color:var(--suave);font-weight:700;min-width:54px}
table.grade tfoot td,table.grade tfoot th{background:#faf7fd;font-weight:700;color:var(--suave);font-size:.9rem}
.cel{display:flex;align-items:stretch;border-radius:10px;border:2px solid transparent;min-width:122px;overflow:hidden}
.cel button{border:0;background:transparent;min-height:44px}
.cel .menos,.cel .mais{width:40px;font-size:1.45rem;font-weight:700;line-height:1}
.cel .menos{color:var(--zero)}
.cel .mais{color:var(--ok)}
.cel .menos:hover,.cel .mais:hover{background:rgba(255,255,255,.6)}
.cel .qtd{flex:1;font-size:1.3rem;font-weight:800;border-left:1px solid rgba(0,0,0,.06)!important;border-right:1px solid rgba(0,0,0,.06)!important}
.cel .qtd small{display:block;font-size:.62rem;font-weight:600;opacity:.7;margin-top:-2px}
.st-zero{background:var(--zero-bg);border-color:#f3b4b4} .st-zero .qtd{color:var(--zero)}
.st-baixo{background:var(--baixo-bg);border-color:#efd57a} .st-baixo .qtd{color:var(--baixo)}
.st-ok{background:var(--ok-bg);border-color:#b5e2c3} .st-ok .qtd{color:var(--ok)}
.st-neutro{background:#f3f1f6;border-color:#e2dde9}
.cel.apagada{opacity:.25}
.cel.pulse{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.06)}}
.cel-vazia{border:1.5px dashed #d8cde6;background:transparent;border-radius:10px;min-width:122px;min-height:44px;color:#b9abc9;font-size:.8rem}
.cel-vazia:hover{background:#faf7fd;color:var(--roxo)}

/* Amostras de cor */
.tecla{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font-weight:800;font-size:.95rem;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12);vertical-align:middle}
.tecla.g{width:40px;height:40px;font-size:1.25rem;border-radius:10px}
.bolinha{display:inline-block;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.15);vertical-align:middle}
.col-nome{margin-top:4px;line-height:1.15}

/* Listas */
table.lista{width:100%;border-collapse:collapse}
table.lista th{text-align:left;font-size:.8rem;color:var(--suave);font-weight:600;padding:8px;border-bottom:2px solid var(--borda)}
table.lista td{padding:8px;border-bottom:1px solid #f1ecf6;vertical-align:middle}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.tag.zero{background:var(--zero-bg);color:var(--zero)} .tag.baixo{background:var(--baixo-bg);color:var(--baixo)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
@media(max-width:640px){
  table.lista.responsiva thead{display:none}
  table.lista.responsiva tr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid #f1ecf6;align-items:center}
  table.lista.responsiva td{border:0;padding:2px}
  table.lista.responsiva td.r-esconde{display:none}
}

/* Contagem */
.cont-input{width:86px;text-align:center;font-size:1.2rem;font-weight:700;padding:8px}
.cont-input.mudou{background:var(--lilas);border-color:var(--roxo)}
.cont-agora{font-size:.72rem;color:var(--suave)}
.barra-fixa{position:fixed;left:0;right:0;bottom:0;background:var(--roxo-escuro);color:#fff;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:30;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
.lista-cont{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lista-cont .it{background:#fff;border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;box-shadow:var(--sombra)}
.lista-cont .cont-input{width:72px}
.tecla,.bolinha{flex-shrink:0}

/* Cadastros */
.lin-cad{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f1ecf6;flex-wrap:wrap}
.lin-cad input[type=text]{flex:1;min-width:120px}
.grid-linhas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 16px}
input[type=color]{width:42px;height:38px;border:1.5px solid var(--borda);border-radius:8px;padding:2px;background:#fff}

/* Diálogo */
dialog{border:0;border-radius:16px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--texto)}
dialog::backdrop{background:rgba(46,26,71,.45)}
.dlg-corpo{padding:20px;max-height:80vh;overflow:auto}
.dlg-pe{padding:12px 20px;background:#faf7fd;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.campo{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.campo>span{font-size:.85rem;font-weight:600;color:var(--suave)}
.radio{display:flex;align-items:center;gap:8px;margin:6px 0}
.ajuste-grande{display:flex;align-items:center;gap:10px;margin:10px 0}
.ajuste-grande button{width:54px;height:54px;border-radius:14px;font-size:1.8rem;font-weight:800;border:0}
.ajuste-grande .q{font-size:2.4rem;font-weight:800;min-width:70px;text-align:center}
.hist{font-size:.88rem}
.hist div{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #f1ecf6}
.hist .d{color:var(--suave);min-width:118px}
.hist .v{font-weight:700;min-width:36px;text-align:right}

/* Fase 2 */
.ed-linha{display:flex;gap:8px;flex-wrap:wrap;align-items:end;padding:8px 0;border-bottom:1px solid #f1ecf6}
.ed-linha select{max-width:210px}
.ed-tem{display:inline-flex;gap:6px;align-items:center;padding-bottom:8px}
.mini-campo{display:flex;flex-direction:column;font-size:.75rem;color:var(--suave);font-weight:600;gap:3px}
.mini-campo input{width:80px}
.atalho{margin-top:10px;padding:10px;background:#faf7fd;border-radius:10px}
.rolos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rolo{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:14px;border-top:6px solid #ccc}
.rolo .g{font-size:1.7rem;font-weight:800;margin-top:6px}
.progresso{height:10px;border-radius:5px;background:#eee;overflow:hidden;margin:6px 0}
.progresso span{display:block;height:100%}
details>summary{cursor:pointer;font-weight:700}
.aviso.peq{display:block}
.tag{background:#eee;color:var(--suave)}
.tag.t-saida{background:#EADFF7;color:var(--roxo)} .tag.t-entrada,.tag.t-producao{background:var(--ok-bg);color:var(--ok)} .tag.t-perda{background:var(--zero-bg);color:var(--zero)}
table.lista tfoot td{border-top:2px solid var(--borda);padding:8px}

/* Fase 3 */
.preco-in{width:96px}
tr.grupo td{background:#faf7fd;font-weight:700;color:var(--roxo);font-size:.85rem;padding:6px 8px}
.chip input[type=radio]{margin:0 4px 0 0;vertical-align:-1px}
.numero span.peq{display:block}

/* Portão de login (site) */
html.trancado header.topo, html.trancado main, html.trancado #toast{display:none!important}
#portao{position:fixed;inset:0;z-index:100;background:var(--creme);display:none;align-items:center;justify-content:center;padding:24px}
html.trancado #portao{display:flex}
#portao .caixa{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(46,26,71,.15);padding:28px 24px;max-width:380px;width:100%;text-align:center}
#portao img{height:90px;margin:0 auto 10px;display:block}
#portao .google{display:inline-flex;gap:10px;align-items:center;justify-content:center;width:100%;border:1.5px solid var(--borda);background:#fff;border-radius:999px;padding:12px 16px;font-weight:700;font-size:1rem;margin-top:14px}
#portao .msg{margin-top:12px;font-size:.9rem;color:var(--suave)}
#portao .msg.erro{color:var(--zero)}

/* Nuvem (link) */
.nuvem{font-size:.8rem;font-weight:700;border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.nuvem.erro{background:#FDE1E1;color:#C62828}
.nuvem.salvando,.nuvem.carregando{opacity:.8}

/* Toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);background:var(--roxo-escuro);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .25s,opacity .25s;z-index:60;display:flex;gap:12px;align-items:center;max-width:92vw;opacity:0;pointer-events:none}
#toast.ver{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
#toast button{background:transparent;border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:4px 10px;font-weight:600}

@media(max-width:640px){
  main{padding:12px 10px 110px}
  .marca small{display:none}
  .cel{min-width:108px}
  .cel .menos,.cel .mais{width:36px}
  .numero b{font-size:1.6rem}
}
@media print{
  header.topo,.nao-imprimir,#toast,.barra-fixa{display:none!important}
  body{background:#fff}
  main{padding:0}
  .cartao{box-shadow:none;padding:0}
}
</style>

const $ = s => document.querySelector(s);

  const letras = {

    linhas: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => ({ id: 'L' + l, nome: l })),
    colunas: combos
  };
  const st = {
    versao: 1, criadoEm: agora,
    config: { minPadrao: 2 },
    categorias: [
      letras,
      { id: 'clickers', nome: 'Clickers (revenda)', todas: false, minPadrao: null, rotuloLinha: 'Item', linhas: [], colunas: unica() },
      { id: 'decoracao', nome: 'Decoração', todas: false, minPadrao: null, rotuloLinha: 'Peça', linhas: [], colunas: dezCores },
      { id: 'brindes', nome: 'Brindes', todas: false, minPadrao: null, rotuloLinha: 'Item', linhas: [], colunas: unica() }
    ],
    itens: {},
    movs: []
  };
  for (const r of letras.linhas) for (const c of letras.colunas)
    st.movs.push({ id: uid(), t: agora, k: chave('letras', r.id, c.id), d: 2, tipo: 'inicial', obs: 'Estoque inicial informado: 2 de cada letra em cada combinação' });
  return st;
}

/* Categorias de produtos próprios (adicionadas na versão 2).
   Cada linha = um modelo; cada coluna = uma cor. Só ficam "existindo" as combinações vistas nas fotos;
   as outras podem ser ligadas tocando em "não tem" na grade. */
const BICHOS_CLICKER = ['Pinguim','Raposinha','Coelhinho','Sapinho','Shiba','Ursinho'];
const CORES_BALDINHO = ['Rosa','Branco','Amarelo','Bege','Azul claro'];
function categoriasProdutos() {
  const cor = c => c === 'Única'
    ? { id: 'c' + uid(), nome: 'Única', base: '', letra: '', hex1: '#E4D9F2', hex2: '' }
    : { id: 'c' + uid(), nome: c, base: c, letra: '', hex1: hexDaCor(c), hex2: '' };
  const montar = (id, nome, rotuloLinha, modelos, cores, existe) => {
    const linhas = modelos.map(m => ({ id: 'M' + uid(), nome: m }));
    const colunas = cores.map(cor);
    const itens = {};
    for (const [m, c] of existe) {
      const l = linhas.find(x => x.nome === m), co = colunas.find(x => x.nome === c);
      itens[chave(id, l.id, co.id)] = { ativo: true };
    }
    return { cat: { id, nome, todas: false, minPadrao: null, rotuloLinha, linhas, colunas }, itens };
  };
  const coresCaixeta = ['Lilás','Rosa','Branco','Verde','Amarelo','Azul claro','Roxo'];
  return [
    montar('caixetas', 'Caixetas', 'Modelo', ['Caixeta'], coresCaixeta, coresCaixeta.map(c => ['Caixeta', c])),
    montar('bichclick', 'Bichinhos clickers', 'Bichinho', BICHOS_CLICKER, ['Única'], BICHOS_CLICKER.map(b => [b, 'Única'])),
    montar('baldinhos', 'Baldinhos', 'Peça', ['Baldinho'], CORES_BALDINHO, CORES_BALDINHO.map(c => ['Baldinho', c])),
    montar('bicharti', 'Bichinhos articulados', 'Bichinho', ['Gatinho','Dálmata bombeiro','Foquinha aviadora','Tartaruguinha','Castor'],
      ['Azul claro','Rosa','Vermelho','Cinza','Marrom'],
      [['Gatinho','Azul claro'],['Gatinho','Rosa'],['Dálmata bombeiro','Vermelho'],['Foquinha aviadora','Cinza'],['Tartaruguinha','Azul claro'],['Castor','Marrom']])
  ];
}
/* Coloca as categorias novas em dados antigos, sem mexer no que já existe. */
function atualizarVersao(st) {
  const v = st.versao || 1;
  let mudou = false;
  if (v < 3) {
    if (v === 2) separarBaldinhos(st);
    let pos = Math.max(1, st.categorias.findIndex(c => c.id === 'letras') + 1);
    for (const { cat, itens } of categoriasProdutos()) {
      const i = st.categorias.findIndex(c => c.id === cat.id);
      if (i >= 0) { pos = i + 1; continue; }
      st.categorias.splice(pos++, 0, cat);
      Object.assign(st.itens, itens);
    }
    st.versao = 3; mudou = true;
  }
  if (st.versao < 4) { atualizacao4(st); st.versao = 4; mudou = true; }
  if (st.versao < 5) { atualizacao5(st); st.versao = 5; mudou = true; }
  if (st.versao < 6) { atualizacao6(st); st.versao = 6; mudou = true; }
  if (st.versao < 7) { atualizacao7(st); st.versao = 7; mudou = true; }
  if (st.versao < 8) { atualizacao8(st); st.versao = 8; mudou = true; }
  return mudou;
}
/* Versão 8: a letra da caixa rosa também é dourada (não mostarda). Só troca o nome. */
function atualizacao8(st) {
  const lt = st.categorias.find(c => c.id === 'letras'); if (!lt) return;
  const rm = lt.colunas.find(co => co.nome.toLowerCase() === 'rosa / mostarda');
  if (rm && !lt.colunas.some(co => co.nome.toLowerCase() === 'rosa / dourado'))
    Object.assign(rm, { nome: 'Rosa / Dourado', letra: 'Dourado', hex2: hexDaCor('Dourado') });
}
/* Versão 7: a caixa é lilás (mesma cor da caixeta lilás) com letra dourada.
   Junta "Azul claro / Dourado", "Lilás / Mostarda" e "Azul claro / Laranja" numa só: "Lilás / Dourado" (sem perder quantidades). */
function atualizacao7(st) {
  const lt = st.categorias.find(c => c.id === 'letras'); if (!lt) return;
  const nomes = ['lilás / dourado', 'azul claro / dourado', 'lilás / mostarda', 'azul claro / laranja'];
  const cols = nomes.map(n => lt.colunas.find(co => co.nome.toLowerCase() === n)).filter(Boolean);
  if (!cols.length) return;
  const fica = cols[0];
  for (const outra of cols.slice(1)) {
    if (outra === fica) continue;
    for (const l of lt.linhas) {
      const kVelha = chave(lt.id, l.id, outra.id), kNova = chave(lt.id, l.id, fica.id);
      for (const m of st.movs) if (m.k === kVelha) m.k = kNova;
      if (st.itens[kVelha]) { st.itens[kNova] = Object.assign({}, st.itens[kVelha], st.itens[kNova]); delete st.itens[kVelha]; }
    }
    lt.colunas = lt.colunas.filter(co => co !== outra);
  }
  Object.assign(fica, { nome: 'Lilás / Dourado', base: 'Lilás', letra: 'Dourado', hex1: hexDaCor('Lilás'), hex2: hexDaCor('Dourado') });
}
/* Versão 6: "Lilás / Mostarda" e "Azul claro / Dourado" são a mesma combinação (a que existe é a azul clara com dourado).
   Se a versão 4 criou a "Lilás / Mostarda", junta tudo na "Azul claro / Dourado" e tira a repetida. */
function atualizacao6(st) {
  const lt = st.categorias.find(c => c.id === 'letras'); if (!lt) return;
  const acha = n => lt.colunas.find(co => co.nome.toLowerCase() === n);
  const lil = acha('lilás / mostarda');
  let az = acha('azul claro / dourado');
  if (lil && !az) { lil.nome = 'Azul claro / Dourado'; lil.base = 'Azul claro'; lil.letra = 'Dourado'; az = lil; }
  else if (lil && az && lil !== az) {
    for (const l of lt.linhas) {
      const kVelha = chave(lt.id, l.id, lil.id), kNova = chave(lt.id, l.id, az.id);
      for (const m of st.movs) if (m.k === kVelha) m.k = kNova;
      if (st.itens[kVelha]) { st.itens[kNova] = Object.assign({}, st.itens[kVelha], st.itens[kNova]); delete st.itens[kVelha]; }
    }
    lt.colunas = lt.colunas.filter(co => co !== lil);
  }
  if (az) { az.hex1 = '#C9C6F2'; az.hex2 = '#D9A21B'; }
}
/* Versão 5: a letra da caixa azul clara é dourada (não laranja) e a Sagrada Família em pé entra no Natal. */
function atualizacao5(st) {
  const lt = st.categorias.find(c => c.id === 'letras');
  const al = lt && lt.colunas.find(co => co.nome.toLowerCase() === 'azul claro / laranja');
  if (al) { al.nome = 'Azul claro / Dourado'; al.letra = 'Dourado'; al.hex2 = hexDaCor('Dourado'); }
  const nt = st.categorias.find(c => c.id === 'natal');
  if (nt && !nt.linhas.some(l => l.nome.toLowerCase() === 'sagrada família em pé')) {
    const l = { id: 'M' + uid(), nome: 'Sagrada Família em pé' };
    nt.linhas.splice(1, 0, l);
    for (const co of nt.colunas) st.itens[chave(nt.id, l.id, co.id)] = { ativo: true };
  }
}
/* Versão 4 (fotos dos produtos, 20/11/2026): corrige nomes e completa cores e produtos.
   Só renomeia o que ainda estiver com o nome antigo e nunca mexe nas quantidades. */
function atualizacao4(st) {
  const achaCat = id => st.categorias.find(c => c.id === id);
  const achaLin = (c, nome) => c && c.linhas.find(l => l.nome.toLowerCase() === nome.toLowerCase());
  const achaCol = (c, nome) => c && c.colunas.find(co => co.nome.toLowerCase() === nome.toLowerCase());
  const novaCol = nome => ({ id: 'c' + uid(), nome, base: nome, letra: '', hex1: hexDaCor(nome), hex2: '' });
  const liga = (c, l, co) => { st.itens[chave(c.id, l.id, co.id)] = Object.assign({}, st.itens[chave(c.id, l.id, co.id)], { ativo: true }); };
  const addCores = (c, nomes, linhas) => { for (const n of nomes) { let co = achaCol(c, n); if (!co) { co = novaCol(n); c.colunas.push(co); } for (const l of linhas || c.linhas) liga(c, l, co); } };
  // Bichinhos clickers: Shiba é lobo; são dois ursos (branco e creme)
  const bc = achaCat('bichclick');
  if (bc) {
    const shiba = achaLin(bc, 'Shiba'); if (shiba) shiba.nome = 'Lobo';
    const urso = achaLin(bc, 'Ursinho'); if (urso) urso.nome = 'Urso creme';
    if (!achaLin(bc, 'Urso branco')) { const l = { id: 'M' + uid(), nome: 'Urso branco' }; bc.linhas.push(l); for (const co of bc.colunas) liga(bc, l, co); }
  }
  // Baldinhos: o "azul claro" é verde-água; mais 4 cores
  const bd = achaCat('baldinhos');
  if (bd) {
    const az = achaCol(bd, 'Azul claro'); if (az && !achaCol(bd, 'Verde-água')) { az.nome = 'Verde-água'; az.base = 'Verde-água'; az.hex1 = hexDaCor('Verde-água'); }
    addCores(bd, ['Verde claro', 'Lavanda', 'Lilás', 'Lilás rosado']);
  }
  // Bichinhos articulados: tartaruguinha (azul) e castor (marrom) são o mesmo hipopótamo
  const ba = achaCat('bicharti');
  if (ba) {
    // pega todas as linhas que são o hipopótamo (nomes antigos ou já renomeadas por ela) e junta numa só
    const doHipo = ba.linhas.filter(l => ['tartaruguinha', 'castor', 'hipopótamo', 'hipopotamo'].includes(l.nome.trim().toLowerCase()));
    const ordem = n => ({ 'hipopótamo': 0, 'hipopotamo': 0, 'tartaruguinha': 1, 'castor': 2 })[n.trim().toLowerCase()];
    doHipo.sort((x, y) => ordem(x.nome) - ordem(y.nome));
    const hipo = doHipo[0];
    if (hipo) hipo.nome = 'Hipopótamo';
    for (const outra of doHipo.slice(1)) {
      for (const co of ba.colunas) {
        const kVelha = chave(ba.id, outra.id, co.id), kNova = chave(ba.id, hipo.id, co.id);
        const temMov = st.movs.some(m => m.k === kVelha);
        if (temMov || (st.itens[kVelha] && st.itens[kVelha].ativo)) {
          for (const m of st.movs) if (m.k === kVelha) m.k = kNova;
          st.itens[kNova] = Object.assign({}, st.itens[kVelha], st.itens[kNova], { ativo: true });
        }
        delete st.itens[kVelha];
      }
      ba.linhas = ba.linhas.filter(l => l !== outra);
    }
    if (hipo) { for (const n of ['Azul claro', 'Marrom']) { let co = achaCol(ba, n); if (!co) { co = novaCol(n); ba.colunas.push(co); } liga(ba, hipo, co); } }
  }
  // Caixetas: completa as 14 cores das fotos
  const cx = achaCat('caixetas');
  if (cx) addCores(cx, ['Lilás', 'Rosa', 'Rosa perolado', 'Roxo', 'Violeta', 'Azul claro', 'Azul metálico', 'Turquesa', 'Verde', 'Amarelo claro', 'Amarelo', 'Laranja', 'Branco', 'Preto']);
  // Letras: as combinações que aparecem nas fotos
  const lt = achaCat('letras');
  if (lt) {
    const rb = achaCol(lt, 'Rosa / Branco');
    if (rb && !achaCol(lt, 'Rosa / Azul claro')) { rb.nome = 'Rosa / Azul claro'; rb.letra = 'Azul claro'; rb.hex2 = '#9DB8F0'; }
    for (const [b, l, h1, h2] of [['Preto', 'Azul', '#2B2B2B', '#3D6BFF']]) {
      if (!achaCol(lt, b + ' / ' + l)) lt.colunas.push({ id: 'c' + uid(), nome: b + ' / ' + l, base: b, letra: l, hex1: h1, hex2: h2 });
    }
  }
  // Categorias novas: cordinhas (18 cores) e Natal
  let pos = Math.max(1, st.categorias.findIndex(c => c.id === 'bicharti') + 1);
  if (!achaCat('cordinhas')) {
    const c = { id: 'cordinhas', nome: 'Cordinhas', todas: false, minPadrao: null, rotuloLinha: 'Item', linhas: [{ id: 'M' + uid(), nome: 'Cordinha' }], colunas: [] };
    st.categorias.splice(pos++, 0, c);
    addCores(c, ['Branco', 'Off-white', 'Amarelo bebê', 'Amarelo', 'Laranja', 'Vermelho', 'Rosa claro', 'Pink', 'Lilás', 'Azul claro', 'Cinza', 'Azul royal', 'Verde claro', 'Verde limão', 'Bege', 'Caramelo', 'Marrom', 'Preto']);
  }
  if (!achaCat('natal')) {
    const c = { id: 'natal', nome: 'Natal', todas: false, minPadrao: null, rotuloLinha: 'Peça',
      linhas: ['Presépio Sagrada Família', 'Bandeja', 'Porta-velas'].map(n => ({ id: 'M' + uid(), nome: n })),
      colunas: [{ id: 'c' + uid(), nome: 'Única', base: '', letra: '', hex1: '#E4D9F2', hex2: '' }] };
    st.categorias.splice(pos++, 0, c);
    for (const l of c.linhas) liga(c, l, c.colunas[0]);
  }
}
/* Versão 2 tinha "bichinho dentro do baldinho" como uma peça só.
   Agora bichinho e baldinho são contados separados: cada peça montada que existia
   vira 1 bichinho + 1 baldinho daquela cor (o histórico é mantido). */
function separarBaldinhos(st) {
  const i = st.categorias.findIndex(c => c.id === 'bichclick');
  if (i < 0) return;
  const velha = st.categorias[i];
  const nova = categoriasProdutos();
  const bich = nova.find(x => x.cat.id === 'bichclick'), bald = nova.find(x => x.cat.id === 'baldinhos');
  // mantém os bichinhos que ela possa ter criado ou renomeado (mesmo id de linha)
  bich.cat.linhas = velha.linhas.map(l => ({ id: l.id, nome: l.nome }));
  bich.cat.minPadrao = velha.minPadrao;
  const colUnica = bich.cat.colunas[0].id;
  bich.itens = {};
  for (const l of bich.cat.linhas) bich.itens[chave('bichclick', l.id, colUnica)] = { ativo: true };
  // cores de baldinho: as que ela tinha na grade antiga
  bald.cat.colunas = velha.colunas.map(c => ({ ...c }));
  const linhaBald = bald.cat.linhas[0].id;
  bald.itens = {};
  for (const c of bald.cat.colunas) bald.itens[chave('baldinhos', linhaBald, c.id)] = { ativo: true };
  const novosMovs = [];
  for (const m of st.movs) {
    const [cat, lin, col] = m.k.split('|');
    if (cat !== 'bichclick') { novosMovs.push(m); continue; }
    novosMovs.push({ ...m, k: chave('bichclick', lin, colUnica) });
    novosMovs.push({ ...m, id: uid(), k: chave('baldinhos', linhaBald, col) });
  }
  st.movs = novosMovs;
  for (const k of Object.keys(st.itens)) if (k.startsWith('bichclick|')) delete st.itens[k];
  Object.assign(st.itens, bich.itens, bald.itens);
  st.categorias.splice(i, 1, bich.cat, bald.cat);
}

/* ---------- carregar / salvar ---------- */
let S;              // estado (dados)
let UI;             // preferências de tela
let META;           // datas de backup
let pilhaDesfazer = [];   // [{desc, json}]
let edicoesContagem = {};
let Q = {};         // quantidades calculadas

function carregar() {
  try { S = JSON.parse(localStorage.getItem(CHAVE)); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.categorias)) { S = estadoInicial(); gravar(); }
  const antes = JSON.stringify(S); normalizar(S); if (JSON.stringify(S) !== antes) gravar();
  try { UI = JSON.parse(localStorage.getItem(CHAVE_UI)) || {}; } catch (e) { UI = {}; }
  UI = Object.assign({ vista: 'painel', cat: 'letras', busca: '', cor: '', situacao: 'todos', impCat: 'todas', contCat: 'letras', contCol: '', cadCat: 'letras', h: { busca: '', tipo: '', cat: '', de: '', ate: '', n: 100 } }, UI);
  if (!UI.mesa || !Array.isArray(UI.mesa.linhas) || !Array.isArray(UI.mesa.rolos)) UI.mesa = novaMesa();
  if (!UI.mov || !Array.isArray(UI.mov.linhas)) UI.mov = novoMov();
  try { META = JSON.parse(localStorage.getItem(CHAVE_META)) || {}; } catch (e) { META = {}; }
}
function gravar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) {}
  copiaDiaria();
  agendarBackupPasta();
  agendarNuvem();
}
const gravarUI = () => localStorage.setItem(CHAVE_UI, JSON.stringify(UI));
const gravarMeta = () => localStorage.setItem(CHAVE_META, JSON.stringify(META));

/* Toda mudança passa por aqui: guarda como estava antes (para o Desfazer). */
function acao(desc, fn) {
  const antes = JSON.stringify(S);
  const r = fn();
  if (r === false) return false;
  pilhaDesfazer.push({ desc, json: antes });
  if (pilhaDesfazer.length > 40) pilhaDesfazer.shift();
  gravar();
  render();
  return true;
}
function desfazer() {
  const u = pilhaDesfazer.pop();
  if (!u) return;
  S = JSON.parse(u.json);
  gravar();
  render();
  toast('Desfeito: ' + u.desc);
}

/* ---------- cálculos ---------- */
function calcular() {
  Q = {};
  for (const m of S.movs) Q[m.k] = (Q[m.k] || 0) + m.d;
}
const cat = id => S.categorias.find(c => c.id === id);
function ativo(c, linId, colId) {
  const it = S.itens[chave(c.id, linId, colId)];
  if (it && it.ativo === false) return false;
  if (it && it.ativo === true) return true;
  return !!c.todas;
}
function minimoDe(c, k) {
  const it = S.itens[k];
  if (it && it.min != null) return it.min;
  if (c.minPadrao != null) return c.minPadrao;
  return S.config.minPadrao;
}
function situacao(q, min) {
  if (min === 0 && q <= 0) return 'neutro';
  if (q <= 0) return 'zero';
  if (q < min) return 'baixo';
  return 'ok';
}
/* Lista de todos os itens que existem (ativos) */
function todosItens() {
  const out = [];
  for (const c of S.categorias) for (const l of c.linhas) for (const co of c.colunas) {
    if (!ativo(c, l.id, co.id)) continue;
    const k = chave(c.id, l.id, co.id);
    const q = Q[k] || 0, min = minimoDe(c, k);
    out.push({ c, l, co, k, q, min, st: situacao(q, min) });
  }
  return out;
}
function acharPorChave(k) {
  const [ci, li, coi] = k.split('|');
  const c = cat(ci); if (!c) return null;
  const l = c.linhas.find(x => x.id === li), co = c.colunas.find(x => x.id === coi);
  if (!l || !co) return null;
  return { c, l, co };
}
const nomeItem = (c, l, co) => (c.id === 'letras' ? 'Letra ' : '') + l.nome + (co.nome === 'Única' ? '' : ' · ' + co.nome);

/* Amostra visual da cor/combinação */
function amostra(co, texto, grande) {
  if (co.hex2) return `<span class="tecla${grande ? ' g' : ''}" style="background:${esc(co.hex1)};color:${esc(co.hex2)}">${esc(texto || 'A')}</span>`;
  return `<span class="bolinha" style="background:${esc(co.hex1)}${grande ? ';width:34px;height:34px' : ''}"></span>`;
}

/* ---------- movimentos ---------- */
function mover(k, d, tipo, obs) {
  S.movs.push({ id: uid(), t: new Date().toISOString(), k, d, tipo, obs: obs || '' });
}
function somar(k, d) {
  const x = acharPorChave(k); if (!x) return;
  const q = Q[k] || 0;
  if (q + d < 0) { toast('Já está em zero.'); return; }
  acao((d > 0 ? '+' : '−') + Math.abs(d) + ' ' + nomeItem(x.c, x.l, x.co), () => mover(k, d, 'ajuste', d > 0 ? 'Botão +' : 'Botão −'));
  const el = document.querySelector(`.cel[data-k="${CSS.escape(k)}"]`);
  if (el) { el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
}

const VISTAS = [
  ['painel', 'Painel'], ['estoque', 'Estoque'], ['imprimir', 'O que imprimir'], ['impressao', 'Impressão'],
  ['movimentos', 'Movimentos'], ['filamentos', 'Filamentos'], ['precos', 'Preços'], ['contagem', 'Contagem'], ['cadastros', 'Cadastros'], ['backup', 'Backup e planilha']

function render() {
  calcular();
  const itens = todosItens();
  const nImp = itens.filter(i => i.st === 'zero' || i.st === 'baixo').length;
  const nCont = Object.keys(edicoesContagem).length;

const rotuloTipo = t => ({ inicial: 'estoque inicial', ajuste: 'ajuste', contagem: 'contagem', entrada: 'entrada', saida: 'venda', perda: 'perda', producao: 'impressão', importacao: 'importação' }[t] || t);

/* ---------- ESTOQUE (grade) ---------- */
function coresDisponiveis() {
  const s = new Set();
  for (const c of S.categorias) for (const co of c.colunas) { if (co.base) s.add(co.base); if (co.letra) s.add(co.letra); }
  return [...s].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}
function linhaPassaBusca(c, l) {
  const b = UI.busca.trim().toLowerCase();
  if (!b) return true;
  const n = l.nome.toLowerCase();
  // Nas letras: digitar "PSN" mostra as letras P, S e N.
  if (n.length === 1 && !b.includes(' ')) return b.includes(n);
  return n.includes(b);
}
const colunaPassaCor = co => !UI.cor || co.base === UI.cor || co.letra === UI.cor;
const passaSituacao = st => UI.situacao === 'todos' || (UI.situacao === 'zero' ? st === 'zero' : (st === 'zero' || st === 'baixo'));

function gradeCategoria(c) {
  const cols = c.colunas.filter(colunaPassaCor);
  if (!c.linhas.length) {
    if (UI.cat !== c.id) return '';
    return `<div class="cartao"><b>${esc(c.nome)}</b>: nenhum item cadastrado ainda.<br><br><button class="btn prim" data-a="vista" data-v="cadastros" data-cad="${c.id}">Cadastrar itens</button></div>`;

/* ---------- O QUE IMPRIMIR ---------- */
function ordenarUrgencia(lista) {
  const ordemCat = id => S.categorias.findIndex(c => c.id === id);
  return lista.slice().sort((a, b) =>
    (a.q > 0) - (b.q > 0) ||                                   // zerados primeiro
    (a.q / (a.min || 1)) - (b.q / (b.min || 1)) ||             // depois o que está mais longe do mínimo
    (b.min - b.q) - (a.min - a.q) ||
    ordemCat(a.c.id) - ordemCat(b.c.id) ||
    a.c.linhas.indexOf(a.l) - b.c.linhas.indexOf(b.l) ||
    a.c.colunas.indexOf(a.co) - b.c.colunas.indexOf(b.co));
}

    <div><h2 style="margin:0">O que preciso imprimir</h2><span class="muted peq">${lista.length ? `${plural(lista.length, 'item', 'itens')} · ${plural(totalPecas, 'peça', 'peças')} para chegar ao mínimo · do mais urgente para o menos` : ''}</span></div>
    <div class="linha-btns nao-imprimir">${lista.length ? `<button class="btn mini prim" data-a="montarMesa">Montar mesa de impressão com esta lista</button><button class="btn mini borda" data-a="copiarLista">Copiar lista</button>${NUVEM.ativa ? '' : '<button class="btn mini borda" data-a="imprimirPagina">Imprimir / PDF</button>'}` : ''}</div></div>`;

      <td class="r-esconde muted">${esc(i.c.nome)}</td>
      <td><span class="tag ${i.st}">${i.q <= 0 ? 'acabou' : i.q}</span></td>
      <td class="r-esconde">${i.min}</td>
      <td><b>${sug}</b></td>
      <td class="nao-imprimir" style="text-align:right"><button class="btn mini ok" data-a="imprimi" data-k="${esc(i.k)}" data-n="${sug}" title="Registra que você imprimiu e soma no estoque">✓ Imprimi</button></td></tr>`;
  });
  h += `</tbody></table><p class="muted peq nao-imprimir" style="margin-top:12px">“Imprimir” = quanto falta para chegar ao mínimo. O botão <b>✓ Imprimi</b> soma no estoque e desconta o filamento do rolo (dá para desfazer). Para várias peças juntas, use <b>Montar mesa de impressão</b>.</p></div>`;

/* =====================================================================
   FASE 2 — movimentos, filamentos e mesa de impressão
   ===================================================================== */
const TIPOS_MOV = [['saida', 'Saída / venda'], ['entrada', 'Entrada'], ['perda', 'Perda'], ['ajuste', 'Ajuste (+ ou −)']];
const AJUDA_MOV = {
  saida: 'Tira do estoque o que foi vendido (ou dado de brinde).',
  entrada: 'Soma no estoque peças que chegaram (ex.: clickers de revenda). Para peças que você imprimiu, use a aba <b>Impressão</b>: lá o filamento é descontado e o custo calculado.',
  perda: 'Tira do estoque peças quebradas, com defeito ou perdidas.',
  ajuste: 'Corrige o estoque: número positivo soma, negativo tira (ex.: <b>-2</b>).'
};
/* Valores de EXEMPLO tirados da planilha (aba Parâmetros). Não são reais. */
const PARAM_EXEMPLO = { kg: 110, W: 150, kwh: 0.9, hora: 10, falha: 0.1, impressora: 2700, vida: 3000, taxa: 0.04, despesas: 0.1, margem: 0.4, embalagem: 1,
  margemMin: 0.15, faixas: [{ a: 2, d: 0.05 }, { a: 3, d: 0.10 }, { a: 5, d: 0.15 }] };

/* Números digitados do jeito brasileiro: "1,5" "1.000" "0.9" */
function num(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
  let s = String(v ?? '').trim().replace(/\s/g, '').replace(/^R\$/i, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}
const fmtN = (v, d = 2) => Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: d });
const fmtR = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtIn = v => v == null || v === '' ? '' : String(+Number(v).toFixed(4)).replace('.', ',');
const round2 = v => Math.round(v * 100) / 100;
const fmtHoras = h => { const t = Math.round(h * 60); const hh = Math.floor(t / 60), mm = t % 60; return hh ? hh + 'h' + (mm ? String(mm).padStart(2, '0') : '') : mm + ' min'; };
const diaLocal = iso => { const d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dataDe = dia => !dia || dia === hojeISO() ? new Date().toISOString() : new Date(dia + 'T12:00:00').toISOString();
const semAcento = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

const pesoPadrao = (c, l) => l.peso ?? c.peso ?? null;
const acabPadrao = (c, l) => l.acab ?? c.acab ?? null;

/* Garante que dados antigos tenham tudo o que a Fase 2 usa */
function normalizar(st) {
  atualizarVersao(st);
  st.rolos = st.rolos || [];
  st.filmovs = st.filmovs || [];
  st.impressoes = st.impressoes || [];
  st.custos = st.custos || {};
  st.param = Object.assign(JSON.parse(JSON.stringify(PARAM_EXEMPLO)), { exemplo: true }, st.param || {});
  st.fichas = st.fichas || {};
  st.produtosX = st.produtosX || [];
  st.combos = st.combos || [];
  st.config.filAviso = st.config.filAviso ?? 150;
  return st;
}

/* ---------- filamento ---------- */
function saldosRolos() { const o = {}; for (const m of S.filmovs) o[m.rolo] = (o[m.rolo] || 0) + m.g; return o; }
function statusRolo(r, g) { if (g <= 0) return 'zero'; if (g < (r.aviso ?? S.config.filAviso)) return 'baixo'; return 'ok'; }
const nomeRolo = r => 'nº ' + r.num + ' · ' + [r.material, r.cor, r.marca].filter(Boolean).join(' ');
function rolosAcabando() { const s = saldosRolos(); return S.rolos.filter(r => !r.arquivado && statusRolo(r, s[r.id] || 0) !== 'ok'); }
function opcoesRolos(sel) {
  const sal = saldosRolos();
  const at = S.rolos.filter(r => !r.arquivado || r.id === sel).sort((a, b) => a.cor.localeCompare(b.cor, 'pt-BR') || a.num - b.num);
  return `<option value="">— escolha o rolo —</option>` + at.map(r =>
    `<option value="${r.id}" ${r.id === sel ? 'selected' : ''}>${esc(nomeRolo(r))} (sobra ${fmtN(sal[r.id] || 0, 0)} g)</option>`).join('');
}
function sugerirRolo(co) {
  const sal = saldosRolos(), alvo = semAcento(co.base || co.nome);
  const c = S.rolos.filter(r => !r.arquivado && (sal[r.id] || 0) > 0 && semAcento(r.cor) === alvo).sort((a, b) => sal[a.id] - sal[b.id]);
  return c[0] ? c[0].id : '';
}

const novoMov = () => ({ tipo: 'saida', dia: '', linhas: [novaLinha()], obs: '', palavra: '', palCol: '' });
const formDe = f => f === 'mesa' ? UI.mesa : UI.mov;

      ${co ? `<span class="peq muted ed-tem">${amostra(co, c.id === 'letras' ? l.nome : '')} tem ${Q[chave(c.id, l.id, co.id)] || 0}</span>` : ''}

function mudarLinha(t) {
  const f = formDe(t.dataset.ed), ln = f.linhas[+t.dataset.i]; if (!ln) return;
  const campo = t.dataset.c;
  ln[campo] = t.value;
  if (campo === 'cat') { ln.lin = ''; ln.col = ''; UI.ultCat = t.value; }
  if (campo === 'lin') {
    ln.col = '';
    const c = cat(ln.cat), l = c && c.linhas.find(x => x.id === ln.lin);
    if (l) {
      const cols = c.colunas.filter(co => ativo(c, l.id, co.id));
      if (cols.length === 1) ln.col = cols[0].id;
      ln.peso = fmtIn(pesoPadrao(c, l)); ln.acab = fmtIn(acabPadrao(c, l));
    }
  }
  gravarUI();
}
function ajudaPalavra(form) {
  const L = cat('letras'); if (!L || !L.colunas.length) return '';
  const f = formDe(form);
  return `<div class="linha-btns atalho"><span class="peq muted">Atalho para letras:</span>
    <input type="text" data-pw="${form}" value="${esc(f.palavra || '')}" placeholder="digite um nome, ex.: PSN" style="width:190px">
    <select data-pwc="${form}">${L.colunas.map(co => `<option value="${co.id}" ${co.id === f.palCol ? 'selected' : ''}>${esc(co.nome)}</option>`).join('')}</select>
    <button class="btn mini borda" data-a="addPalavra" data-ed="${form}">+ Adicionar as letras</button></div>`;
}
function addPalavra(form) {
  const f = formDe(form), L = cat('letras');
  const col = f.palCol || L.colunas[0].id;
  const txt = String(f.palavra || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '');
  if (!txt) { toast('Digite o nome primeiro.'); return; }
  const cont = {}, faltam = new Set();
  for (const ch of txt) {
    const l = L.linhas.find(x => x.nome.toUpperCase() === ch);
    if (!l || !ativo(L, l.id, col)) { faltam.add(ch); continue; }
    cont[l.id] = (cont[l.id] || 0) + 1;
  }
  f.linhas = f.linhas.filter(x => x.lin);
  for (const l of L.linhas) {
    const n = cont[l.id]; if (!n) continue;
    const ex = f.linhas.find(x => x.cat === 'letras' && x.lin === l.id && x.col === col);
    if (ex) ex.q = String(num(ex.q) + n);

async function registrarMov() {
  calcular();
  const f = UI.mov, tipo = f.tipo, erros = [], somas = {};
  for (const ln of f.linhas) {
    if (!ln.lin) continue;
    const c = cat(ln.cat), l = c && c.linhas.find(x => x.id === ln.lin), co = l && c.colunas.find(x => x.id === ln.col);
    if (!co) { erros.push(`Escolha a cor de ${l ? l.nome : 'um item'}.`); continue; }
    const q = Math.round(num(ln.q)), nome = nomeItem(c, l, co);
    if (tipo === 'ajuste' ? !q : !(q > 0)) { erros.push(`${nome}: quantidade inválida.`); continue; }
    const d = tipo === 'entrada' || tipo === 'ajuste' ? q : -q;
    const k = chave(c.id, l.id, co.id);
    somas[k] = (somas[k] || 0) + d;
  }
  for (const [k, d] of Object.entries(somas)) {
    const x = acharPorChave(k);
    if ((Q[k] || 0) + d < 0) erros.push(`${nomeItem(x.c, x.l, x.co)}: só tem ${Q[k] || 0} no estoque.`);
  }
  if (!Object.keys(somas).length && !erros.length) erros.push('Escolha pelo menos um item.');
  if (erros.length) return alerta('Confira antes de registrar', erros.map(esc).join('<br>'));
  const t = dataDe(f.dia), n = Object.keys(somas).length;
  const rot = TIPOS_MOV.find(x => x[0] === tipo)[1];
  acao(`${rot.split(' ')[0].toLowerCase()} de ${plural(n, 'item', 'itens')}`, () => {
    for (const [k, d] of Object.entries(somas)) S.movs.push({ id: uid(), t, k, d, tipo, obs: f.obs.trim() });
  });
  UI.mov = Object.assign(novoMov(), { tipo, dia: f.dia, palCol: f.palCol });
  gravarUI(); render();
  toast(`${rot}: ${plural(n, 'item registrado', 'itens registrados')} ✅`, true);
}

/* ---------- MESA DE IMPRESSÃO ---------- */
function calcMesa(m) {
  const P = S.param, out = { linhas: [], erros: [] };
  for (const ln of m.linhas) {
    if (!ln.lin) continue;
    const c = cat(ln.cat), l = c && c.linhas.find(x => x.id === ln.lin), co = l && c.colunas.find(x => x.id === ln.col);
    if (!co) { out.erros.push(`Escolha a cor de ${l ? l.nome : 'uma peça'}.`); continue; }
    const q = Math.round(num(ln.q));
    if (!(q > 0)) { out.erros.push(`${nomeItem(c, l, co)}: quantidade inválida.`); continue; }
    out.linhas.push({ c, l, co, k: chave(c.id, l.id, co.id), q, peso: num(ln.peso), acab: num(ln.acab), temAcab: String(ln.acab).trim() !== '' });
  }
  out.pecas = out.linhas.reduce((s, x) => s + x.q, 0);
  out.pesoPecas = out.linhas.reduce((s, x) => s + x.peso * x.q, 0);
  const semPeso = out.linhas.filter(x => !(x.peso > 0));
  out.rolos = (m.rolos || []).filter(r => r.rolo || num(r.g) > 0).map(r => ({ rolo: r.rolo, r: S.rolos.find(x => x.id === r.rolo), g: num(r.g) }));
  if (out.rolos.length === 1 && !(out.rolos[0].g > 0)) {
    if (out.pesoPecas > 0 && !semPeso.length) { out.rolos[0].g = out.pesoPecas; out.rolos[0].auto = true; }
    else out.erros.push('Informe quantos gramas saíram do rolo (ou o peso de cada peça).');
  }
  if (out.rolos.length > 1 && out.rolos.some(r => !(r.g > 0))) out.erros.push('Com mais de um rolo, diga quantos gramas saíram de cada um (aparece no resumo do fatiador).');
  if (out.linhas.length > 1 && semPeso.length) out.erros.push('Falta o peso de: ' + semPeso.map(x => nomeItem(x.c, x.l, x.co)).join(', ') + '. Ele aparece no fatiador (ou pese uma peça pronta).');
  const gRolos = out.rolos.reduce((s, r) => s + (r.g > 0 ? r.g : 0), 0);
  out.gTotal = gRolos > 0 ? gRolos : out.pesoPecas;
  out.h = num(m.h) + num(m.min) / 60;
  let soma = 0, gs = 0;
  for (const r of out.rolos) if (r.g > 0) { soma += r.g * ((r.r && r.r.precoKg) || P.kg); gs += r.g; }
  out.precoKg = gs > 0 ? soma / gs : P.kg;
  const desgH = P.impressora / P.vida;
  for (const x of out.linhas) {
    // parte desta peça na mesa = peso dela ÷ peso de todas as peças
    const parte = out.pesoPecas > 0 && x.peso > 0 ? x.peso / out.pesoPecas : (out.linhas.length === 1 ? 1 / x.q : 0);
    x.g = parte * out.gTotal; x.h = parte * out.h;
    x.fil = x.g / 1000 * out.precoKg;
    x.ene = x.h * (P.W / 1000) * P.kwh;
    x.desg = x.h * desgH;
    x.mo = x.acab / 60 * P.hora;
    x.base = x.fil + x.ene + x.desg + x.mo;
    x.falha = x.base * P.falha;
    x.custo = x.base + x.falha;
  }
  out.total = out.linhas.reduce((s, x) => s + x.custo * x.q, 0);
  return out;
}

async function registrarImpressao(m, rapido) {
  calcular();
  const r = calcMesa(m);
  if (!r.linhas.length) { await alerta('Mesa vazia', 'Adicione pelo menos uma peça.'); return false; }
  if (r.erros.length) { await alerta('Falta pouco', r.erros.map(esc).join('<br>')); return false; }
  const sal = saldosRolos(), temCusto = r.h > 0;

      (temCusto ? `<p>Custo de produção da mesa: <b>${fmtR(r.total)}</b></p>` : `<p class="muted peq">Sem o tempo de impressão, o custo não fica guardado.</p>`);
    if (!await confirmar('Registrar impressão?', corpo, 'Registrar')) return false;
  }

  let numero;

    }

    S.impressoes.push({
      id, num: numero, t, obs: (m.obs || '').trim(), gTotal: r.gTotal, h: r.h, precoKg: r.precoKg, total: temCusto ? r.total : null,
      rolos: r.rolos.filter(x => x.g > 0).map(x => ({ rolo: x.rolo, g: x.g })),

    });

}

async function desfazerImpressao(id) {

  if (!await confirmar(`Desfazer a impressão nº ${imp.num}?`, `Vai tirar do estoque ${plural(movs.reduce((s, m) => s + m.d, 0), 'peça', 'peças')}${g ? ` e devolver <b>${fmtN(g, 1)} g</b> ao filamento` : ''}. A impressão sai da lista. Dá para usar “Desfazer” logo em seguida.`, 'Desfazer impressão', true)) return;

  });
}

function telaFilamentos() {
  const sal = saldosRolos();
  const at = S.rolos.filter(r => !r.arquivado), arq = S.rolos.filter(r => r.arquivado);
  const ordem = { zero: 0, baixo: 1, ok: 2 };
  at.sort((a, b) => ordem[statusRolo(a, sal[a.id] || 0)] - ordem[statusRolo(b, sal[b.id] || 0)] || a.cor.localeCompare(b.cor, 'pt-BR') || a.num - b.num);
  let h = `<div class="cartao"><div class="linha-btns" style="justify-content:space-between"><div><h2 style="margin:0">Rolos de filamento</h2>

    <div class="linha-btns" style="margin-top:12px"><span class="peq">Avisar quando um rolo tiver menos de</span><input type="text" inputmode="numeric" id="filAviso" value="${S.config.filAviso}" style="width:80px"><span class="peq">g <span class="muted">(cada rolo pode ter o seu)</span></span></div></div>`;

  else {
    const porCor = {};
    for (const r of at) { const o = porCor[r.cor] = porCor[r.cor] || { g: 0, n: 0, hex: r.hex }; o.g += Math.max(0, sal[r.id] || 0); o.n++; }
    h += `<div class="cartao"><h3>Quanto tenho de cada cor</h3><div class="linha-btns">` + Object.entries(porCor).sort((a, b) => a[0].localeCompare(b[0], 'pt-BR')).map(([c, o]) =>
      `<span class="chip" style="display:inline-flex;gap:6px;align-items:center"><span class="bolinha" style="background:${esc(o.hex)};width:14px;height:14px"></span>${esc(c)}: <b>${fmtN(o.g, 0)} g</b> <span class="muted peq">(${plural(o.n, 'rolo', 'rolos')})</span></span>`).join('') + `</div></div>`;
    h += `<div class="rolos">${at.map(r => cardRolo(r, sal[r.id] || 0)).join('')}</div>`;
  }

  return h;
}
function cardRolo(r, g) {

  const bt = (a, t, cls = 'borda') => `<button class="btn mini ${cls}" data-a="${a}" data-id="${r.id}">${t}</button>`;
  return `<div class="rolo" style="border-top-color:${esc(r.hex || '#ccc')}">
    <div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><div><span class="bolinha" style="background:${esc(r.hex || '#ccc')}"></span> <b>Rolo nº ${r.num}</b>

      ${r.arquivado ? '<span class="tag">arquivado</span>' : `<span class="tag ${st}">${st === 'zero' ? 'acabou' : st === 'baixo' ? 'acabando' : 'ok'}</span>`}</div>

}

  const ms = S.filmovs.filter(f => f.rolo === id).slice().reverse();
  const rot = { novo: 'rolo novo', impressao: 'impressão', uso: 'uso', pesagem: 'pesagem' };
  abrirDialogo(`<div class="dlg-corpo"><h2>Rolo nº ${r.num}</h2><p class="muted">${esc([r.material, r.cor, r.marca].filter(Boolean).join(' · '))}</p>
    <div class="hist">${ms.map(m => `<div><span class="d">${fmtData(m.t)}</span><span class="v" style="min-width:70px;color:${m.g > 0 ? 'var(--ok)' : 'var(--zero)'}">${m.g > 0 ? '+' : '−'}${fmtN(Math.abs(m.g), 1)} g</span><span>${esc(rot[m.tipo] || m.tipo)}${m.obs ? ' <span class="muted">· ' + esc(m.obs) + '</span>' : ''}</span></div>`).join('') || '<span class="muted">Sem movimentos.</span>'}</div></div>
    <div class="dlg-pe"><button class="btn prim" data-r="1">Fechar</button></div>`);
  dlg.onclick = e => { if (e.target.closest('[data-r]')) { dlg.close(); dlg.onclick = null; } };
}
async function acaoRolo(a, id) {
  const r = S.rolos.find(x => x.id === id); if (!r) return;
  if (a === 'roloEditar') return abrirRolo(id);
  if (a === 'roloUsar') return usarRolo(id);
  if (a === 'roloPesar') return pesarRolo(id);
  if (a === 'roloHist') return histRolo(id);
  if (a === 'roloArquivar') { acao('arquivar rolo nº ' + r.num, () => { r.arquivado = true; }); return toast('Rolo nº ' + r.num + ' arquivado', true); }
  if (a === 'roloReativar') { acao('reativar rolo nº ' + r.num, () => { r.arquivado = false; }); return; }
  if (a === 'roloExcluir') {
    if (await confirmar('Excluir rolo?', `O <b>rolo nº ${r.num}</b> (${esc([r.material, r.cor].join(' '))}) e o histórico dele vão sair do sistema. As impressões já registradas continuam. Dá para usar “Desfazer” logo em seguida.`, 'Excluir', true))
      acao('excluir rolo nº ' + r.num, () => { S.rolos = S.rolos.filter(x => x.id !== id); S.filmovs = S.filmovs.filter(f => f.rolo !== id || f.imp); });
  }
}

/* ---------- painel: vendas ---------- */
function vendas30() {
  const desde = Date.now() - 30 * 864e5, por = {};
  let total = 0;
  for (const m of S.movs) if (m.tipo === 'saida' && new Date(m.t) >= desde) { por[m.k] = (por[m.k] || 0) - m.d; total -= m.d; }
  const top = Object.entries(por).map(([k, n]) => ({ x: acharPorChave(k), n })).filter(o => o.x).sort((a, b) => b.n - a.n).slice(0, 6);
  return { total, top };
}

/* =====================================================================
   FASE 3 — PREÇOS (mesmas fórmulas da planilha "PSN Precificação com Estoque")
   Diferença combinada: a embalagem é UMA POR PEDIDO. Vendendo 1 peça sozinha,
   a conta é igual à planilha. Em quantidade e combos, a embalagem entra uma vez só.
   ===================================================================== */
const arred05 = x => Math.ceil(x * 2 - 1e-9) / 2;              // CEILING(x; 0,5)
const pct = (v, d = 1) => fmtN(v * 100, d) + '%';

/* Cada linha do estoque é um produto; nas letras, a categoria inteira é um produto só. */
function produtos() {
  const out = [];
  for (const c of S.categorias) {
    if (c.todas) out.push({ pid: 'c:' + c.id, nome: c.id === 'letras' ? 'Letra (1 unidade)' : c.nome, c, l: null });
    else for (const l of c.linhas) out.push({ pid: 'l:' + c.id + '|' + l.id, nome: l.nome, c, l });
  }
  for (const x of S.produtosX) out.push({ pid: 'x:' + x.id, nome: x.nome, c: null, l: null, x });
  return out;
}
const acharProduto = pid => produtos().find(p => p.pid === pid);
const pidDoItem = (c, l) => c.todas ? 'c:' + c.id : 'l:' + c.id + '|' + l.id;

function fichaDe(pid) {
  const p = acharProduto(pid), f = S.fichas[pid] || {};
  const tipo = f.tipo || (p && p.c && /revenda/i.test(p.c.nome) ? 'revenda' : 'peca');
  const pesoBase = p && p.c ? (p.l ? pesoPadrao(p.c, p.l) : p.c.peso ?? null) : null;
  const acabBase = p && p.c ? (p.l ? acabPadrao(p.c, p.l) : p.c.acab ?? null) : null;
  return {
    tipo, g: f.g ?? pesoBase, h: f.h ?? null, acab: f.acab ?? acabBase, outros: f.outros ?? null,
    emb: f.emb !== false, manual: f.manual ?? null, concorrente: f.concorrente ?? null,
    compra: f.compra ?? null, compraQtd: f.compraQtd ?? 1, frete: f.frete ?? null, freteQtd: f.freteQtd ?? 1, outrosRev: f.outrosRev ?? null
  };
}
const fichaPreenchida = fi => fi.tipo === 'revenda' ? num(fi.compra) > 0 : (num(fi.g) || num(fi.h) || num(fi.acab) || num(fi.outros)) > 0;

/* Preço de 1 produto vendido sozinho (abas "Peças 3D" e "Revenda" da planilha) */
function calcPreco(fi) {
  const P = S.param, r = { fi };
  if (fi.tipo === 'revenda') {
    r.B = num(fi.compra) / (num(fi.compraQtd) || 1);          // custo de compra por unidade
    r.C = num(fi.frete) / (num(fi.freteQtd) || 1);             // frete por unidade
    r.D = num(fi.outrosRev);                                    // outros custos
    r.base = r.B + r.C + r.D;
  } else {
    const g = num(fi.g), h = num(fi.h), acab = num(fi.acab);
    r.F = g / 1000 * P.kg;                                      // filamento
    r.G = h * (P.W / 1000) * P.kwh;                             // energia
    r.H = h * (P.impressora / P.vida);                          // desgaste da máquina
    r.I = acab / 60 * P.hora;                                   // mão de obra
    r.E = num(fi.outros);                                       // outros materiais
    r.J = (r.F + r.G + r.H + r.I + r.E) * P.falha;              // falhas
    r.base = r.F + r.G + r.H + r.I + r.E + r.J;
  }
  r.emb = fi.emb ? P.embalagem : 0;                             // embalagem (se vai sozinho)
  r.custo1 = r.base + r.emb;                                    // = "Custo total" da planilha
  r.div = 1 - P.margem - P.taxa - P.despesas;
  r.sugerido = r.div > 0 ? r.custo1 / r.div : null;
  r.arredondado = r.sugerido != null ? arred05(r.sugerido) : null;
  r.preco = num(fi.manual) > 0 ? num(fi.manual) : r.arredondado;
  if (r.preco > 0) {
    r.lucro = r.preco - r.custo1 - r.preco * (P.taxa + P.despesas);
    r.margem = r.lucro / r.preco;
    const dm = 1 - P.margemMin - (P.taxa + P.despesas);
    r.descMax = dm > 0 ? Math.max(0, 1 - r.custo1 / dm / r.preco) : null;
  }
  r.mercado = r.preco > 0 && num(fi.concorrente) > 0 ? (r.preco <= num(fi.concorrente) ? 'Dentro do mercado' : 'Acima do mercado') : '';
  return r;
}
function situacaoMargem(m) {
  if (m == null || !Number.isFinite(m)) return { st: 'neutro', txt: '—' };
  if (m < 0) return { st: 'zero', txt: 'Prejuízo' };
  if (m < S.param.margemMin) return { st: 'zero', txt: 'Abaixo do mínimo' };
  if (m < S.param.margem - 0.0001) return { st: 'baixo', txt: 'Abaixo do desejado' };
  return { st: 'ok', txt: 'OK' };
}
function descontoDaQtd(n) { let d = 0; for (const f of S.param.faixas) if (num(f.a) > 0 && n >= num(f.a)) d = Math.max(d, num(f.d)); return d; }

/* Venda de N unidades (aba "Descontos"). modo 'pedido' = 1 embalagem; 'planilha' = 1 por peça */
function simular(r, n, modo = 'pedido', precoManual) {
  const P = S.param, s = { n };
  s.preco = num(precoManual) > 0 ? num(precoManual) : r.preco;
  s.desc = descontoDaQtd(n);
  s.precoDesc = s.preco * (1 - s.desc);
  s.totalSem = n * s.preco;
  s.total = n * s.precoDesc;
  s.economia = s.totalSem - s.total;
  s.custo = modo === 'planilha' ? n * r.custo1 : n * r.base + (r.emb || 0);
  s.lucro = s.total - s.custo - s.total * (P.taxa + P.despesas);
  s.lucroUn = n ? s.lucro / n : 0;
  s.margem = s.total > 0 ? s.lucro / s.total : null;
  const dm = 1 - P.margemMin - (P.taxa + P.despesas);
  s.descMax = dm > 0 && s.totalSem > 0 ? Math.max(0, 1 - s.custo / dm / s.totalSem) : null;
  return s;
}
/* Combo de até 3 produtos (aba "Combos") */
function calcCombo(cb, modo = 'pedido') {
  const P = S.param, o = { itens: [] };
  let algumEmb = false;
  for (const it of cb.itens) {
    if (!it.pid || !(num(it.q) > 0)) continue;
    const p = acharProduto(it.pid); if (!p) continue;
    const r = calcPreco(fichaDe(it.pid)); if (r.emb) algumEmb = true;
    o.itens.push({ p, r, q: num(it.q) });
  }
  o.normal = o.itens.reduce((s, x) => s + (x.r.preco || 0) * x.q, 0);                       // H
  o.custo = modo === 'planilha' ? o.itens.reduce((s, x) => s + x.r.custo1 * x.q, 0)          // I
    : o.itens.reduce((s, x) => s + x.r.base * x.q, 0) + (o.itens.length ? P.embalagem : 0);
  o.preco = num(cb.preco) > 0 ? num(cb.preco) : o.normal;                                    // J
  o.descEq = o.normal > 0 ? 1 - o.preco / o.normal : null;                                   // K
  o.lucro = o.preco - o.custo - o.preco * (P.taxa + P.despesas);                             // L
  o.margem = o.preco > 0 ? o.lucro / o.preco : null;                                         // M
  const dm = 1 - P.margemMin - (P.taxa + P.despesas);
  o.minimo = dm > 0 ? arred05(o.custo / dm) : null;                                          // N
  o.situacao = o.margem == null ? '' : o.margem >= P.margemMin ? 'OK: margem acima do mínimo' : o.margem < 0 ? 'Atenção: prejuízo' : 'Atenção: margem abaixo do mínimo';
  return o;
}

/* Valor do estoque e lucro estimado (Painel) */
function valorEstoque() {
  calcular();
  const cache = {}, P = S.param;
  let custo = 0, venda = 0, lucro = 0, semPreco = 0;
  for (const i of todosItens()) {
    if (i.q <= 0) continue;
    const pid = pidDoItem(i.c, i.l);
    if (!cache[pid]) { const fi = fichaDe(pid); cache[pid] = { ok: fichaPreenchida(fi), r: calcPreco(fi) }; }
    const { ok, r } = cache[pid];
    let base = ok ? r.base : (S.custos[i.k] ? S.custos[i.k].v : null);
    if (base == null) { semPreco += i.q; continue; }
    custo += i.q * base;
    if (r.preco > 0) { venda += i.q * r.preco; lucro += i.q * (r.preco - base - r.preco * (P.taxa + P.despesas)); }
  }
  return { custo, venda, lucro, semPreco };
}

/* ---------- TELA PREÇOS ---------- */

    <button class="btn mini borda" data-a="prodNovo">+ Produto só para preço</button></div>`;

  let grupo = null;
  for (const p of lista) {

    if (fc === 'todas' && g !== grupo) { grupo = g; h += `<tr class="grupo"><td colspan="8">${esc(g)}</td></tr>`; }
    const fi = fichaDe(p.pid), ok = fichaPreenchida(fi), r = calcPreco(fi), sm = situacaoMargem(r.margem);
    h += `<tr><td><b>${esc(p.nome)}</b>${fi.tipo === 'revenda' ? ' <span class="tag">revenda</span>' : ''}${fi.emb ? '' : ' <span class="tag" title="Não leva embalagem própria">sem emb.</span>'}${ok ? '' : '<br><span class="peq" style="color:var(--baixo)">ficha vazia</span>'}${r.mercado ? `<br><span class="peq muted">${r.mercado}</span>` : ''}</td>
      <td style="text-align:right">${fmtR(r.custo1)}</td>
      <td style="text-align:right" class="r-esconde muted">${r.arredondado != null ? fmtR(r.arredondado) : '—'}</td>

      <td style="text-align:right">${r.lucro != null ? fmtR(r.lucro) : '—'}</td>

      <td style="text-align:right"><button class="btn mini borda" data-a="ficha" data-pid="${esc(p.pid)}">Ficha</button></td></tr>`;
  }
  h += `</tbody></table><p class="peq muted" style="margin-top:10px">Margem: <span class="tag ok">verde</span> atingiu a margem desejada (${pct(S.param.margem, 0)}) ·

    “Desc. máx.” = maior desconto que ainda deixa a margem mínima, vendendo 1.</p></div>`;
  return h;
}
function htmlFichaRes(fi) {
  const r = calcPreco(fi), P = S.param, sm = situacaoMargem(r.margem);
  const ln = (t, v, b) => `<div><span style="flex:1">${t}</span>${b ? '<b>' + fmtR(v) + '</b>' : fmtR(v)}</div>`;
  let h = `<div class="hist peq">`;
  if (fi.tipo === 'revenda') h += ln('Compra por unidade', r.B) + ln('Frete por unidade', r.C) + ln('Outros custos', r.D);
  else h += ln(`Filamento (${fmtN(num(fi.g), 2)} g × ${fmtR(P.kg)}/kg)`, r.F) + ln(`Energia (${fmtN(num(fi.h), 2)} h)`, r.G) + ln('Desgaste da impressora', r.H) +
    ln(`Mão de obra (${fmtN(num(fi.acab), 1)} min)`, r.I) + ln('Outros materiais', r.E) + ln(`Falhas (${pct(P.falha, 0)})`, r.J);

/* =====================================================================
   NUVEM — quando o sistema é aberto pelo link (claude.ai), o estoque fica
   salvo na conta da dona e aparece igual no Mac e no iPad.
   Aberto como arquivo no computador, nada disto roda (continua só local).
   O estoque é guardado em pedaços (estoque_partes/r<versão>-<n>) e o
   documento estoque/meta diz qual versão é a atual.
   ===================================================================== */
const NUVEM = { db: null, down: null, ativa: false, rev: 0, salvando: false, pendente: false, forcar: false, status: '', timer: null };
const TAM_PARTE = 120000;
const revLocal = () => { try { return +localStorage.getItem('psn_nuvem_rev') || 0; } catch (e) { return 0; } };
const guardarRev = r => { try { localStorage.setItem('psn_nuvem_rev', String(r)); } catch (e) {} };
function statusNuvem(st, txt) {
  NUVEM.status = st;
  const el = document.getElementById('nuvemStatus'); if (!el) return;
  const t = { carregando: '☁️ Carregando…', ok: '☁️ Salvo', salvando: '☁️ Salvando…', vazio: '☁️ Conta nova', erro: '⚠️ Sem conexão' }[st] || '';
  el.hidden = !t; el.textContent = txt || t; el.className = 'nuvem ' + st;
}
const qualAparelho = () => /iPad/.test(navigator.userAgent) || (/Mac/.test(navigator.platform) && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(navigator.userAgent) ? 'iPhone' : 'computador';
async function iniciarNuvem() {
  if (MODO_SITE) return iniciarFirebase();
  if (!window.claude || typeof window.claude.use !== 'function') return;
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) {}
  try { NUVEM.down = await window.claude.use('downloads'); } catch (e) {}
  if (!db) { render(); return; }
  return conectarNuvem(db);
}
async function conectarNuvem(db) {
  NUVEM.db = db; NUVEM.rev = revLocal();
  statusNuvem('carregando');
  const limite = setTimeout(() => { if (NUVEM.status === 'carregando') statusNuvem('erro', '⚠️ Não consegui carregar da conta'); }, 12000);
  try {
    const snap = await db.doc('estoque/meta').get();
    clearTimeout(limite);
    if (!snap.exists) statusNuvem('vazio');
    else { const m = snap.data(); if (m.rev !== NUVEM.rev) await baixarDaNuvem(m); else statusNuvem('ok'); }
  } catch (e) { clearTimeout(limite); statusNuvem('erro'); }
  NUVEM.ativa = true;
  db.doc('estoque/meta').onSnapshot(async s => {
    if (!s.exists || s.metadata.hasPendingWrites) return;
    const m = s.data();
    if (m.rev > NUVEM.rev && !NUVEM.salvando) { await baixarDaNuvem(m); toast('Estoque atualizado (mudança feita no ' + (m.aparelho || 'outro aparelho') + ')'); }
  }, () => statusNuvem('erro'));
  render();
}
/* ---------- Firebase (site) ---------- */
const FB_VER = '10.14.1';
const carregarScript = src => new Promise((ok, erro) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => erro(new Error('não carregou ' + src)); document.head.appendChild(s); });
function msgPortao(txt, erro) { const el = document.getElementById('portaoMsg'); if (el) { el.textContent = txt || ''; el.className = 'msg' + (erro ? ' erro' : ''); } }
/* deixa o Firestore com a mesma "cara" do banco usado pelo link do Claude */
function adaptarFirestore(fs) {
  const embrulha = sn => ({ exists: sn.exists, data: () => sn.data(), metadata: sn.metadata });
  return { doc: caminho => { const r = fs.doc(caminho); return {
    get: () => r.get().then(embrulha), set: d => r.set(d), delete: () => r.delete(),
    onSnapshot: (ok, erro) => r.onSnapshot(sn => ok(embrulha(sn)), erro) }; } };
}
async function iniciarFirebase() {
  const logo = document.getElementById('logoPSN'), pl = document.getElementById('portaoLogo'); if (logo && pl) pl.src = logo.src;
  msgPortao('Carregando…');
  try {
    for (const m of ['app', 'auth', 'firestore']) await carregarScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
    firebase.initializeApp(FIREBASE_CONFIG);
    try { await firebase.firestore().enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  } catch (e) { msgPortao('Sem internet para entrar agora. Tente de novo em instantes.', true); return; }
  msgPortao('');
  firebase.auth().onAuthStateChanged(async u => {
    if (!u) { document.documentElement.classList.add('trancado'); document.getElementById('portaoSair').hidden = true; msgPortao(''); return; }
    msgPortao('Entrando como ' + u.email + '…');
    const db = adaptarFirestore(firebase.firestore());
    try { await db.doc('estoque/meta').get(); }
    catch (e) {
      if (e && e.code === 'permission-denied') { msgPortao('A conta ' + u.email + ' não tem acesso a este estoque.', true); document.getElementById('portaoSair').hidden = false; return; }
      msgPortao('Não consegui falar com o banco de dados: ' + (e && e.message || e), true); document.getElementById('portaoSair').hidden = false; return;
    }
    NUVEM.email = u.email;
    document.documentElement.classList.remove('trancado');
    await conectarNuvem(db);
  });
}
async function entrarGoogle() {
  if (!window.firebase || !firebase.apps.length) return;
  const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
  try { await firebase.auth().signInWithPopup(prov); }
  catch (e) {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return firebase.auth().signInWithRedirect(prov);
    if (e && e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') msgPortao('Não deu para entrar: ' + e.message, true);
  }
}
async function sairGoogle() {
  try { localStorage.removeItem(CHAVE); localStorage.removeItem('psn_nuvem_rev'); } catch (e) {}
  if (window.firebase && firebase.apps.length) await firebase.auth().signOut();
  location.reload();
}
async function lerDaNuvem(m) {
  let txt = '';
  for (let i = 0; i < m.partes; i++) {
    const p = await NUVEM.db.doc('estoque_partes/r' + m.rev + '-' + i).get();
    if (!p.exists) throw new Error('parte faltando');
    txt += p.data().t;
  }
  if (txt.length !== m.tamanho) throw new Error('tamanho diferente');
  return JSON.parse(txt);
}
async function baixarDaNuvem(m) {
  try {
    const st = await lerDaNuvem(m);
    if (!validarEstado(st)) throw new Error('inválido');
    S = normalizar(st); NUVEM.rev = m.rev; guardarRev(m.rev);
    try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) {}
    pilhaDesfazer = [];   // o "Desfazer" não volta mudanças feitas em outro aparelho
    statusNuvem('ok'); render();
  } catch (e) { console.warn('nuvem', e); statusNuvem('erro', '⚠️ Não consegui carregar da conta'); }
}
function agendarNuvem() {
  if (!NUVEM.ativa) return;
  clearTimeout(NUVEM.timer); statusNuvem('salvando');
  NUVEM.timer = setTimeout(salvarNaNuvem, 1200);
}
/* Se os dois aparelhos salvaram ao mesmo tempo, junta os lançamentos de cada um. */
function mesclar(local, remoto) {
  for (const campo of ['movs', 'filmovs', 'impressoes']) {
    const ids = new Set((local[campo] || []).map(x => x.id));
    for (const x of remoto[campo] || []) if (!ids.has(x.id)) local[campo].push(x);
  }
  return local;
}
async function salvarNaNuvem() {
  if (!NUVEM.ativa) return;
  if (NUVEM.salvando) { NUVEM.pendente = true; return; }
  NUVEM.salvando = true; statusNuvem('salvando');
  try {
    const metaRef = NUVEM.db.doc('estoque/meta');
    const atual = await metaRef.get();
    const velho = atual.exists ? atual.data() : null;
    if (velho && velho.rev > NUVEM.rev && !NUVEM.forcar) {
      try { mesclar(S, await lerDaNuvem(velho)); localStorage.setItem(CHAVE, JSON.stringify(S)); render(); } catch (e) {}
    }
    NUVEM.forcar = false;
    const txt = JSON.stringify(S), rev = Math.max(NUVEM.rev, velho ? velho.rev : 0) + 1;
    const n = Math.max(1, Math.ceil(txt.length / TAM_PARTE));
    for (let i = 0; i < n; i++) await NUVEM.db.doc('estoque_partes/r' + rev + '-' + i).set({ t: txt.slice(i * TAM_PARTE, (i + 1) * TAM_PARTE) });
    await metaRef.set({ rev, partes: n, tamanho: txt.length, salvoEm: new Date().toISOString(), aparelho: qualAparelho() });
    NUVEM.rev = rev; guardarRev(rev);
    if (velho) for (let i = 0; i < velho.partes; i++) NUVEM.db.doc('estoque_partes/r' + velho.rev + '-' + i).delete().catch(() => {});
    statusNuvem('ok');
  } catch (e) {
    console.warn('nuvem', e);
    statusNuvem('erro', e && e.code === 'quota_exceeded' ? '⚠️ Conta cheia' : '⚠️ Não salvou na conta');
  }
  NUVEM.salvando = false;
  if (NUVEM.pendente) { NUVEM.pendente = false; salvarNaNuvem(); }
}

/* =====================================================================
   BACKUPS
   ===================================================================== */
function idb() {
  return new Promise((ok, erro) => {
    const r = indexedDB.open('psn', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('copias'); r.result.createObjectStore('kv'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error);
  });
}
async function idbOp(store, modo, fn) {
  const db = await idb();
  return new Promise((ok, erro) => {
    const tx = db.transaction(store, modo); const r = fn(tx.objectStore(store));
    tx.oncomplete = () => ok(r && r.result); tx.onerror = () => erro(tx.error);
  });
}
let timerCopia;
function copiaDiaria() {
  clearTimeout(timerCopia);
  timerCopia = setTimeout(async () => {
    try {
      const dia = hojeISO();
      await idbOp('copias', 'readwrite', s => s.put({ dia, salvoEm: new Date().toISOString(), json: JSON.stringify(S) }, dia));
      const chaves = await idbOp('copias', 'readonly', s => s.getAllKeys());
      const velhas = (chaves || []).sort().slice(0, -30);
      if (velhas.length) await idbOp('copias', 'readwrite', s => velhas.forEach(k => s.delete(k)));
    } catch (e) { console.warn('cópia diária', e); }
  }, 800);
}
async function listarCopias() {
  const el = document.getElementById('listaCopias'); if (!el) return;
  try {
    const todas = (await idbOp('copias', 'readonly', s => s.getAll())) || [];
    todas.sort((a, b) => b.dia.localeCompare(a.dia));
    el.innerHTML = todas.length ? todas.map(c => {
      let pecas = '?';
      try { const st = JSON.parse(c.json); pecas = st.movs.reduce((s, m) => s + m.d, 0); } catch (e) {}
      return `<div><span class="d">${fmtDia(c.dia)}</span><span style="flex:1">salva às ${new Date(c.salvoEm).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})} · ${nfmt(pecas)} peças</span>
        <button class="btn mini borda" data-a="restaurarCopia" data-dia="${c.dia}">Voltar para esta</button></div>`;
    }).join('') : '<span class="muted">Nenhuma cópia ainda.</span>';
  } catch (e) { el.textContent = 'Não foi possível ler as cópias deste navegador.'; }
}

/* Pasta de backup (Chrome) */
const pasta = { handle: null, ok: false };
async function iniciarPasta() {
  if (!('showDirectoryPicker' in window)) return;
  try {
    pasta.handle = await idbOp('kv', 'readonly', s => s.get('pasta')) || null;
    if (pasta.handle) pasta.ok = (await pasta.handle.queryPermission({ mode: 'readwrite' })) === 'granted';
  } catch (e) { pasta.handle = null; }
  render();
}
async function escolherPasta() {
  try {
    const h = await window.showDirectoryPicker({ id: 'psn-backup', mode: 'readwrite' });
    pasta.handle = h; pasta.ok = true;
    await idbOp('kv', 'readwrite', s => s.put(h, 'pasta'));
    await escreverPasta();
    toast('Backup automático ligado ✅');
  } catch (e) { if (e.name !== 'AbortError') alert('Não foi possível usar essa pasta: ' + e.message); }
  render();
}
async function reativarPasta() {
  try { pasta.ok = (await pasta.handle.requestPermission({ mode: 'readwrite' })) === 'granted'; if (pasta.ok) { await escreverPasta(); toast('Backup reativado ✅'); } }
  catch (e) { pasta.ok = false; }
  render();
}
let timerPasta;
function agendarBackupPasta() { if (pasta.ok) { clearTimeout(timerPasta); timerPasta = setTimeout(escreverPasta, 2000); } }
async function escreverPasta() {
  if (!pasta.ok || !pasta.handle) return;
  try {
    const fh = await pasta.handle.getFileHandle('PSN-backup-' + hojeISO() + '.json', { create: true });
    const w = await fh.createWritable(); await w.write(JSON.stringify(S, null, 1)); await w.close();
    META.ultimoBackupPasta = new Date().toISOString(); gravarMeta();
  } catch (e) { console.warn(e); pasta.ok = false; render(); }
}

function baixar(nome, blob) {
  if (NUVEM.down) {   // pelo link, o arquivo é oferecido pelo próprio Claude
    NUVEM.down.save({ filename: nome, data: blob }).then(() => toast('Arquivo salvo ✅')).catch(e => { if (!e || e.code !== 'declined') alerta('Não consegui baixar', 'Tente de novo em alguns segundos.'); });
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function validarEstado(st) {
  return st && Array.isArray(st.categorias) && Array.isArray(st.movs) && st.config && typeof st.itens === 'object';
}

/* =====================================================================
   PLANILHA: XLSX (escrita e leitura) e CSV — sem bibliotecas externas

    else if (novo.itens[k] && novo.itens[k].ativo === false) novo.itens[k].ativo = true;
    const qv = String(ln[iQ] ?? '').replace(',', '.').trim();
    if (qv !== '') {
      const q = Math.round(Number(qv));
      if (!Number.isFinite(q) || q < 0) erros.push('Linha ' + (r + 1) + ': quantidade inválida (' + esc(qv) + ')');
      else { const atual = Q[k] || 0; if (q !== atual) { novo.movs.push({ id: uid(), t: agora, k, d: q - atual, tipo: 'importacao', obs: 'Importado de ' + arquivo.name }); mudQ.push(`${ni} · ${nv}: ${atual} → ${q}`); } }
    }
    if (iMin >= 0) {
      const mv = String(ln[iMin] ?? '').replace(',', '.').trim();
      const atualMin = minimoDe(cat(c.id) || c, k);
      if (mv !== '' && Number.isFinite(Number(mv)) && Math.round(Number(mv)) !== atualMin) {
        novo.itens[k] = Object.assign({}, novo.itens[k], { min: Math.max(0, Math.round(Number(mv))) });
        mudM.push(`${ni} · ${nv}: mínimo ${atualMin} → ${Math.round(Number(mv))}`);
      }
    }
  }
  if (!mudQ.length && !mudM.length && !criados.length) return alerta('Nada para mudar', 'A planilha está igual ao que já está no sistema.' + (erros.length ? '<br><br>' + erros.map(esc).join('<br>') : ''));
  const lista = (t, arr) => arr.length ? `<h3 style="margin-top:12px">${t} (${arr.length})</h3><div class="peq" style="max-height:150px;overflow:auto">${arr.slice(0, 200).map(esc).join('<br>')}</div>` : '';
  const ok = await confirmar('Importar planilha?', `Confira o que vai mudar:` + lista('Quantidades', mudQ) + lista('Mínimos', mudM) + lista('Novos cadastros', criados) + lista('Linhas com problema (serão ignoradas)', erros), 'Importar');
  if (!ok) return;
  acao('importar planilha', () => { S = novo; });
  toast('Planilha importada ✅');
}

const dlg = $('#dlg');
function abrirDialogo(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function confirmar(titulo, corpo, botao = 'Confirmar', perigo = false) {
  return new Promise(res => {
    abrirDialogo(`<div class="dlg-corpo"><h2>${titulo}</h2><div>${corpo}</div></div>
      <div class="dlg-pe"><button class="btn borda" data-r="0">Cancelar</button><button class="btn ${perigo ? 'perigo' : 'prim'}" data-r="1">${botao}</button></div>`);
    dlg.onclick = e => { const b = e.target.closest('[data-r]'); if (b) { dlg.close(); dlg.onclick = null; res(b.dataset.r === '1'); } };
    dlg.oncancel = () => { dlg.onclick = null; res(false); };
  });
}
function alerta(titulo, corpo) { return confirmar(titulo, corpo, 'OK').then(() => {}); }
function perguntar(titulo, rotulo, valor = '') {
  return new Promise(res => {
    abrirDialogo(`<form method="dialog"><div class="dlg-corpo"><h2>${titulo}</h2><label class="campo"><span>${rotulo}</span><input type="text" id="pergunta" value="${esc(valor)}" required></label></div>
