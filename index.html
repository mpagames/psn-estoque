    const inp = $('#pergunta'); inp.focus(); inp.select();
    dlg.onclick = e => { if (e.target.closest('[data-r="0"]')) { dlg.close(); dlg.onclick = null; res(null); } };
    dlg.querySelector('form').onsubmit = () => { dlg.onclick = null; res(inp.value.trim() || null); };
    dlg.oncancel = () => { dlg.onclick = null; res(null); };
  });
}
let timerToast;
function toast(msg, comDesfazer) {
  const t = $('#toast');
  t.innerHTML = esc(msg) + (comDesfazer ? ' <button data-a="desfazer">Desfazer</button>' : '');
  t.classList.add('ver'); clearTimeout(timerToast); timerToast = setTimeout(() => t.classList.remove('ver'), 3200);
}

/* Detalhes de um item */
function abrirItem(k) {
  calcular();
  const x = acharPorChave(k); if (!x) return;
  const { c, l, co } = x, q = Q[k] || 0, min = minimoDe(c, k), it = S.itens[k] || {};
  const padrao = c.minPadrao ?? S.config.minPadrao;
  const hist = S.movs.filter(m => m.k === k).slice(-15).reverse();
  abrirDialogo(`<div class="dlg-corpo">
    <div style="display:flex;gap:14px;align-items:center">${amostra(co, c.id === 'letras' ? l.nome : '', true)}<div><h2 style="margin:0">${esc(nomeItem(c, l, co))}</h2><span class="muted">${esc(c.nome)}</span></div></div>
    <div class="ajuste-grande"><button style="background:var(--zero-bg);color:var(--zero)" data-i="menos">−</button><span class="q" id="iq">${q}</span><button style="background:var(--ok-bg);color:var(--ok)" data-i="mais">+</button>
      <span class="tag ${situacao(q, min)}" style="margin-left:8px">${TXT_ST[situacao(q, min)]}</span></div>
    <p class="peq muted" style="margin:0">Peso de 1 peça: <b>${pesoPadrao(c, l) != null ? fmtN(pesoPadrao(c, l), 2) + ' g' : 'não informado'}</b>${S.custos[k] ? ` · Último custo de produção: <b>${fmtR(S.custos[k].v)}</b> (${fmtDia(diaLocal(S.custos[k].t))})` : ''}${(() => { const r = calcPreco(fichaDe(pidDoItem(c, l))); return r.preco > 0 ? ` · Preço: <b>${fmtR(r.preco)}</b>` : ''; })()}</p>
    <label class="campo"><span>Mudar direto para</span><div class="linha-btns"><input type="number" min="0" id="iPara" style="width:100px" placeholder="${q}"><button class="btn mini prim" data-i="para">Aplicar</button></div></label>
    <div class="campo"><span>Estoque mínimo (abaixo disso fica amarelo)</span>
      <label class="radio"><input type="radio" name="tmin" value="p" ${it.min == null ? 'checked' : ''}> Usar o padrão (${padrao})</label>
      <label class="radio"><input type="radio" name="tmin" value="o" ${it.min != null ? 'checked' : ''}> Próprio: <input type="number" min="0" id="iMin" style="width:80px" value="${it.min ?? padrao}"></label>
      <div class="linha-btns" style="margin-top:4px"><button class="btn mini prim" data-i="salvarMin">Salvar mínimo</button>
      <button class="btn mini borda" data-i="minLinha">Usar em toda a linha ${esc(l.nome)}</button>
      <button class="btn mini borda" data-i="minCol">Usar em toda a coluna ${esc(co.nome)}</button></div></div>
    <h3 style="margin-top:16px">Histórico</h3><div class="hist">${hist.length ? hist.map(m => `<div><span class="d">${fmtData(m.t)}</span><span class="v" style="color:${m.d > 0 ? 'var(--ok)' : 'var(--zero)'}">${m.d > 0 ? '+' : ''}${m.d}</span><span>${esc(rotuloTipo(m.tipo))}${m.obs ? ' <span class="muted">· ' + esc(m.obs) + '</span>' : ''}</span></div>`).join('') : '<span class="muted">Sem movimentos.</span>'}</div>
    </div><div class="dlg-pe">${c.todas && c.id === 'letras' ? '' : `<button class="btn perigo" data-i="desativar" style="margin-right:auto">Este item não existe nesta cor</button>`}<button class="btn prim" data-i="fechar">Fechar</button></div>`);
  dlg.oncancel = null;
  dlg.onclick = async e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const a = b.dataset.i;
    if (a === 'fechar') { dlg.close(); return; }
    if (a === 'mais' || a === 'menos') { somar(k, a === 'mais' ? 1 : -1); abrirItem(k); return; }
    if (a === 'para') {
      const v = parseInt($('#iPara').value, 10);
      if (!(v >= 0)) return toast('Digite um número (0 ou mais).');
      if (v !== q) acao(`${nomeItem(c, l, co)} → ${v}`, () => mover(k, v - q, 'ajuste', 'Mudado direto para ' + v));
      abrirItem(k); return;
    }
    const lerMin = () => document.querySelector('input[name=tmin]:checked').value === 'p' ? null : Math.max(0, parseInt($('#iMin').value, 10) || 0);
    if (a === 'salvarMin') { const v = lerMin(); acao('mínimo de ' + nomeItem(c, l, co), () => { S.itens[k] = Object.assign({}, S.itens[k], { min: v }); }); toast('Mínimo salvo'); abrirItem(k); return; }
    if (a === 'minLinha' || a === 'minCol') {
      const v = lerMin();
      const alvos = a === 'minLinha' ? c.colunas.map(o => chave(c.id, l.id, o.id)) : c.linhas.map(o => chave(c.id, o.id, co.id));
      acao('mínimo de ' + (a === 'minLinha' ? 'linha ' + l.nome : 'coluna ' + co.nome), () => { for (const kk of alvos) S.itens[kk] = Object.assign({}, S.itens[kk], { min: v }); });
      toast(`Mínimo ${v == null ? 'padrão' : v} aplicado em ${alvos.length} itens`); abrirItem(k); return;
    }
    if (a === 'desativar') {
      dlg.close();
      if (await confirmar('Remover este item?', `<b>${esc(nomeItem(c, l, co))}</b> vai sair da grade${q ? ` (tem <b>${q}</b> em estoque)` : ''}. O histórico fica guardado e você pode cadastrar de novo depois.`, 'Remover', true))
        acao('remover ' + nomeItem(c, l, co), () => { S.itens[k] = Object.assign({}, S.itens[k], { ativo: false }); });
    }
  };
}

        NUVEM.forcar = true; acao('voltar para cópia de ' + fmtDia(c.dia), () => { S = normalizar(st); }); toast('Dados restaurados ✅');
      } break; }
    case 'exportarXlsx': exportarXlsx(); break;
    case 'exportarCsv': exportarCsv(); break;

});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.f === 'cor' || t.dataset.f === 'situacao') { UI[t.dataset.f] = t.value; gravarUI(); render(); return; }
  if (t.id === 'minGeral') { const v = Math.max(0, parseInt(t.value, 10) || 0); acao('mínimo padrão geral', () => { S.config.minPadrao = v; }); toast('Mínimo padrão: ' + v); return; }
  if (t.id === 'minCat') { const c = cat(UI.cadCat); const v = t.value === '' ? null : Math.max(0, parseInt(t.value, 10) || 0); acao('mínimo de ' + c.nome, () => { c.minPadrao = v; }); return; }
  if (t.dataset.cad) {
    const c = cat(UI.cadCat);

    const l = t.closest('[data-lin]') && c.linhas.find(x => x.id === t.closest('[data-lin]').dataset.lin);

    if (t.dataset.cad === 'colHex1') acao('cor de ' + co.nome, () => { co.hex1 = v; });

    if (t.dataset.cad === 'linNome' && v && l) acao('renomear ' + l.nome, () => { l.nome = v; });
    const nv = v === '' ? null : Math.max(0, num(v));
    if (t.dataset.cad === 'linPeso' && l) acao('peso de ' + l.nome, () => { l.peso = nv; });
    if (t.dataset.cad === 'linAcab' && l) acao('acabamento de ' + l.nome, () => { l.acab = nv; });

  if (t.id === 'arqJson' && t.files[0]) {

});
document.addEventListener('keydown', e => {

async function salvarContagem() {
  calcular();
  const muda = [], erros = [];
  let iguais = 0;
  for (const [k, v] of Object.entries(edicoesContagem)) {
    const n = Number(v);
    if (!Number.isInteger(n) || n < 0) { erros.push(v); continue; }
    const q = Q[k] || 0;
    if (n === q) iguais++; else muda.push([k, q, n]);
  }
  if (erros.length) return alerta('Confira os números', 'Use só números inteiros, 0 ou mais.');
  const corpo = muda.length
    ? `<b>${plural(muda.length, 'item muda', 'itens mudam')}</b>${iguais ? ` e ${plural(iguais, 'bateu', 'bateram')} com o sistema` : ''}:<div class="hist" style="max-height:240px;overflow:auto;margin-top:8px">` +
      muda.map(([k, q, n]) => { const x = acharPorChave(k); return `<div><span style="flex:1">${esc(nomeItem(x.c, x.l, x.co))}</span><span>${q} → <b>${n}</b></span></div>`; }).join('') + '</div>'
    : `Tudo bateu! ${plural(iguais, 'item conferido', 'itens conferidos')}, nada muda.`;
  if (!await confirmar('Salvar contagem?', corpo, 'Salvar')) return;
  if (muda.length) acao('contagem (' + plural(muda.length, 'item', 'itens') + ')', () => { for (const [k, q, n] of muda) mover(k, n - q, 'contagem', 'Contagem: era ' + q + ', contei ' + n); });
  edicoesContagem = {};
  render();
  toast('Contagem salva ✅', !!muda.length);
}
function copiarLista() {
  calcular();
  let lista = todosItens().filter(i => i.st === 'zero' || i.st === 'baixo');
  if (UI.impCat !== 'todas') lista = lista.filter(i => i.c.id === UI.impCat);
  const txt = 'PSN — O que imprimir (' + new Date().toLocaleDateString('pt-BR') + ')\n' +
    ordenarUrgencia(lista).map(i => `☐ ${Math.max(1, i.min - i.q)}× ${i.l.nome}${i.co.nome === 'Única' ? '' : ' (' + i.co.nome + ')'}${i.q <= 0 ? ' — ACABOU' : ''}`).join('\n');
  navigator.clipboard.writeText(txt).then(() => toast('Lista copiada! Cole no WhatsApp ou nas Notas.'), () => alerta('Lista', '<pre style="white-space:pre-wrap">' + esc(txt) + '</pre>'));
}

/* Avisa antes de fechar se tiver contagem não salva */
window.addEventListener('beforeunload', e => { if (Object.keys(edicoesContagem).length) { e.preventDefault(); e.returnValue = ''; } });

/* Início */
carregar();
render();
iniciarPasta();
copiaDiaria();
iniciarNuvem();
</script>
